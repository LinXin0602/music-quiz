function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function h(tag,props,...kids){const e=document.createElement(tag);if(props)for(const k in props){if(k==="style")e.style.cssText=props[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),props[k]);else if(k in e)e[k]=props[k];else e.setAttribute(k,props[k])}for(const c of kids.flat()){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e}

  const p=cur.p,s=cur.st,e=Math.min(p.len,cur.en+(extra||0));

    if(ps===0||(d&&d.video_id&&d.video_id!==p.id)||(ps===1&&t>=e)){stop();st.textContent="播完了"}}catch(x){}},250);}

function pick(p,clip,w){const c=p.segs.filter(s=>s[2]),o=p.segs.filter(s=>!s[2]);
  if(c.length&&Math.random()<w){const s=c[rnd(c.length)];return[s[0]+rnd(17)-8,s[1],1]}
  if(o.length&&Math.random()<0.5){const s=o[rnd(o.length)];return[s[0]+rnd(17)-8,s[1],0]}
  const L=p.len-off(p),lo=off(p)+Math.min(L*0.03,10),hi=Math.max(lo,p.len-clip-3);return[lo+rnd(Math.max(1,hi-lo)),"隨機抽的位置",0]}

function ask(){stop();const S=set();

  const clip=Math.max(5,+clipIn.value||20),w=(+wIn.value||0)/100;const i=nextIdx(),p=S.pieces[i];const r=pick(p,clip,w);
  const s0=Math.max(off(p),Math.min(p.len-clip,Math.round(r[0])));cur={i,p,st:s0,en:Math.min(p.len,s0+clip),desc:r[1],c:r[2]};n++;

  const order=shufIn.checked?shuffle([...S.pieces.keys()]):[...S.pieces.keys()];
  opts.replaceChildren(...order.map((k,j)=>{const b=h("button",{className:"opt",onclick:()=>answer(k)},lab(j)+". "+S.pieces[k].name);b.dataset.k=k;return b}));
  fb.style.display="none";nx.style.display="none";upd();}
function answer(k){if(!cur||cur.done)return;cur.done=true;const right=k===cur.i;if(right)ok++;
  opts.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.k===cur.i)b.classList.add("r");else if(+b.dataset.k===k)b.classList.add("w")});
  fb.replaceChildren(h("b",null,right?"答對了！":"答錯了")," 答案："+cur.p.name,h("br"),"這段（"+fmt(cur.st)+" 起）："+cur.desc,cur.c?h("span",{className:"tag"},"轉變處"):null);
  fb.style.display="block";nx.style.display="inline-block";upd();fb.scrollIntoView({behavior:"smooth",block:"nearest"})}
function restart(){n=0;ok=0;bag=[];cur=null;ask()}
// ---- 題庫管理 ----
const linkIn=h("textarea",{placeholder:"貼上 YouTube 影片或歌單連結，一行一個（可以一次貼很多行）"});
const addMsg=h("span",{className:"note"});
const newName=h("input",{placeholder:"新題庫名稱，例如：鋼琴文獻3"});
const list=h("div");
function parseLink(s){s=s.trim();if(!s)return null;try{const u=new URL(s.startsWith("http")?s:"https://"+s);const v=u.searchParams.get("v"),l=u.searchParams.get("list");
  if(v)return{v};if(u.hostname.includes("youtu.be"))return{v:u.pathname.slice(1)};const sm=u.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/);if(sm)return{v:sm[2]};if(l)return{l}}catch(e){}
  if(/^[\w-]{11}$/.test(s))return{v:s};return null}
async function probe(id){player.cueVideoById(id);await waitState([5,-1],6000);let d=player.getVideoData(),len=player.getDuration();
  if(!len){player.mute();player.loadVideoById(id);await waitState([1,3],8000);len=player.getDuration();d=player.getVideoData();player.pauseVideo();player.unMute()}
  if(!d||!d.title)throw 0;return{id,name:d.title,len:Math.round(len)||300,segs:[]}}
async function listIds(lid){player.cuePlaylist({listType:"playlist",list:lid});await waitState([5],8000);const ids=player.getPlaylist()||[];return ids}
async function addLinks(){if(!ready){addMsg.textContent="播放器還在載入，請稍等再按";return}const S=set();const lines=linkIn.value.split(/\s+/).filter(Boolean);let added=0,skip=0,bad=0;busy=true;stop();
  for(const ln of lines){const q=parseLink(ln);if(!q){bad++;continue}
    try{const ids=q.v?[q.v]:await listIds(q.l);if(!ids.length)throw 0;
      for(const id of ids){if(S.pieces.some(p=>p.id===id)){skip++;continue}addMsg.textContent=`讀取中…（已加入 ${added} 首）`;
        try{S.pieces.push(await probe(id));added++;save()}catch(e){bad++}}
    }catch(e){bad++}}
  busy=false;try{player.stopVideo()}catch(e){}save();addMsg.textContent=`加入 ${added} 首`+(skip?`，${skip} 首已在題庫`:"")+(bad?`，${bad} 個讀不到`:"");linkIn.value="";bag=[];renderMgr();if(!cur)ask()}
function renderMgr(){const S=set();
  setSel.replaceChildren(...DB.sets.map((s,i)=>h("option",{value:String(i),selected:i===DB.cur},`${s.name}（${s.pieces.length} 首）`)));
  list.replaceChildren(...S.pieces.map((p,i)=>h("div",{className:"pc"},
    h("div",{className:"seg"},h("input",{className:"nm",value:p.name,onchange:e=>{p.name=e.target.value;save()}})),
    h("div",{className:"seg"},"範圍 ",h("input",{value:fmt(off(p)),style:"width:84px",onchange:e=>{const t=parseT(e.target.value);if(!isNaN(t)&&t<p.len){p.off=t;save()}renderMgr()}})," 到 ",
      h("input",{value:fmt(p.len),style:"width:84px",onchange:e=>{const t=parseT(e.target.value);if(!isNaN(t)&&t>off(p)){p.len=t;save()}renderMgr()}}),
      h("button",{className:"x",style:"color:#7a3b2e",onclick:()=>{const c=clone(p);c.name=p.name+"（分段）";c.off=Math.round((off(p)+p.len)/2);p.len=c.off;p.off=off(p);c.segs=[];S.pieces.splice(i+1,0,c);save();bag=[];renderMgr()}},"✂ 從中間分成兩個選項"),
      h("button",{className:"x",onclick:()=>{S.pieces.splice(i,1);save();bag=[];renderMgr()}},"✕ 移除")),
    ...p.segs.map((s,j)=>h("div",{className:"seg"},h("input",{value:fmt(s[0]),style:"width:84px",onchange:e=>{const t=parseT(e.target.value);if(!isNaN(t)){s[0]=t;save()}renderMgr()}}),
      h("input",{value:s[1],style:"flex:1;min-width:150px",onchange:e=>{s[1]=e.target.value;save()}}),
      h("label",null,h("input",{type:"checkbox",checked:!!s[2],onchange:e=>{s[2]=e.target.checked?1:0;save()}})," 轉變處"),
      h("button",{className:"x",onclick:()=>{p.segs.splice(j,1);save();renderMgr()}},"✕"))),
    h("div",{className:"seg"},h("button",{className:"pb g sm",onclick:()=>{p.segs.push([Math.round((off(p)+p.len)/2),"轉變處",1]);save();renderMgr()}},"＋ 新增片段時間"))
  )));}
document.getElementById("app").append(
  h("div",{className:"top"},h("h1",null,"音聽・一題一題練"),stat),
  h("div",{className:"set",style:"margin:10px 0 0"},"題庫 ",setSel),
  h("div",{className:"card"},qn,
    h("button",{className:"pb",onclick:()=>play(0)},"▶ 播放"),
    h("button",{className:"pb g",onclick:()=>play(10)},"再聽（+10 秒）"),
    h("button",{className:"pb g",onclick:stop},"■ 停止"),st,opts,fb,nx),
  h("details",null,h("summary",null,"測驗設定"),
    h("div",{className:"set"},h("label",null,"片段長度 ",clipIn," 秒"),h("label",null,"「轉變處」比重 ",wIn," %"),h("label",null,shufIn," 每題打亂選項"),
      h("button",{className:"pb g sm",onclick:restart},"重新計分")),
    h("p",{className:"note"},"內建曲目的片段起點是依曲式結構與錄音長度推估，可能差幾十秒；可在「題庫管理」修正。")),
  h("details",null,h("summary",null,"題庫管理：貼連結新增曲目"),
    h("p",{className:"note"},"新曲目會加入上方「題庫」選單目前選的題庫。"),
    linkIn,h("div",{className:"set"},h("button",{className:"pb sm",onclick:addLinks},"加入題目"),addMsg),
    h("div",{className:"set"},newName,h("button",{className:"pb g sm",onclick:()=>{const nm=newName.value.trim();if(!nm)return;DB.sets.push({name:nm,pieces:[]});DB.cur=DB.sets.length-1;newName.value="";save();restart();renderMgr()}},"＋ 建立新題庫"),
      h("button",{className:"x",onclick:()=>{const S=set();const b=BUILTIN.find(x=>x.name===S.name);if(b){DB.sets[DB.cur]=clone(b)}else{DB.sets.splice(DB.cur,1);DB.cur=0}save();restart();renderMgr()}},"還原／刪除目前題庫")),
    h("p",{className:"note"},"新加入的曲目會從整首隨機抽片段；想多考轉變處，就在曲目下方「＋ 新增片段時間」填入時間（例如 2:40）並勾「轉變處」。多樂章的影片可以用「✂ 分成兩個選項」再調整範圍。選項名稱可以直接改。設定存在這個瀏覽器裡。"),
    list));
renderMgr();ask();
</script>
